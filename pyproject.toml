[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ros-pc-manager"
version = "0.1.0"
description = "LAN web manager for multiple ROS 2 PCs"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "psutil>=5.9,<8",
  "zeroconf>=0.132,<1",
  "segno>=1.6,<2",
]

[project.scripts]
ros-pc-manager-server = "pc_manager_server.main:main"
ros-pc-manager-agent = "pc_manager_agent.main:main"

[tool.setuptools]
packages = ["pc_manager_server", "pc_manager_agent"]
package-dir = { pc_manager_server = "backend/pc_manager_server", pc_manager_agent = "agent/pc_manager_agent" }

[tool.pytest.ini_options]
testpaths = ["tests"]
